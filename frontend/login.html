<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: #f8f9fa; 
        }

        .login-box { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08); 
            
            /* 🛠️ 모바일 반응형 핵심 치트키 */
            width: 90%;          /* 모바일 기기에서는 좌우 여백 살짝 남기고 꽉 채우기 */
            max-width: 400px;    /* 대신 컴퓨터 화면처럼 커지면 최대 400px까지만 늘어나게 고정 */
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.75rem;
            color: #1f2937;
            font-weight: 700;
        }

        input { 
            display: block; 
            width: 100%; 
            margin-bottom: 12px; 
            padding: 12px 16px; 
            box-sizing: border-box; 
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: #f9fafb;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
            background-color: #ffffff;
        }

        /* 메인 페이지랑 어울리는 고급진 보라 그라데이션 적용 */
        button { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 12px; 
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.2);
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover { 
            opacity: 0.9;
            transform: scale(1.01);
        }

        #msg {
            font-size: 0.85rem;
            margin: 10px 0 0 0;
            font-weight: 500;
        }

        hr {
            margin: 25px 0;
            border: 0;
            border-top: 1px solid #e5e7eb;
        }

        /* 회원가입 버튼 스타일 정의 */
        .register-btn {
            background: #ffffff !important;
            color: #374151 !important;
            border: 1px solid #d1d5db !important;
            box-shadow: none !important;
        }

        .register-btn:hover {
            background: #f9fafb !important;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>로그인</h2>
        <input type="text" id="userId" placeholder="아이디">
        <input type="password" id="userPw" placeholder="비밀번호">
        <button onclick="login()">로그인</button>
        <p id="msg" style="color:#ef4444;"></p>
        <hr>
        <button class="register-btn" onclick="register()">회원가입</button>
    </div>

    <script>
        // 백엔드 렌더 서버 주소 설정
        const API_URL = 'https://jobscore.onrender.com';

        // 1. 회원가입 함수
        async function register() {
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('userPw').value;

            const res = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, password })
            });
            const data = await res.json();
            if(data.success) alert("회원가입 성공! 이제 로그인하세요.");
            else alert("실패: " + data.message);
        }

        // 2. 로그인 함수
        async function login() {
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('userPw').value;

            const res = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, password })
            });
            const data = await res.json();

            if(data.success) {
                alert(data.userId + "님 환영합니다!");
                localStorage.setItem('user', data.userId);
                localStorage.setItem('score', data.score);
                window.location.href = "index.html";
            } else {
                document.getElementById('msg').innerText = "아이디 또는 비밀번호가 틀렸습니다.";
            }
        }
    </script>
</body>
</html>
