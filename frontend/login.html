<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f4; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>로그인</h2>
        <input type="text" id="userId" placeholder="아이디">
        <input type="password" id="userPw" placeholder="비밀번호">
        <button onclick="login()">로그인</button>
        <p id="msg" style="color:red;"></p>
        <hr>
        <button onclick="register()" style="background:#28a745;">회원가입</button>
    </div>

    <script>
        // 백엔드 렌더 서버 주소 설정
        const API_URL = 'https://jobscore.onrender.com';

        // 1. 회원가입 함수
        async function register() {
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('userPw').value;

            // localhost:3000 대신 API_URL 적용
            const res = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, password })
            });
            const data = await res.json();
            if(data.success) alert("회원가입 성공! 이제 로그인하세요.");
            else alert("실패: " + data.message);
        }

        // 2. 로그인 함수
        async function login() {
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('userPw').value;

            // localhost:3000 대신 API_URL 적용
            const res = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, password })
            });
            const data = await res.json();

            if(data.success) {
                alert(data.userId + "님 환영합니다!");
                // 로그인 성공하면 index.html로 이동하면서 정보를 넘김
                localStorage.setItem('user', data.userId);
                localStorage.setItem('score', data.score);
                window.location.href = "index.html";
            } else {
                document.getElementById('msg').innerText = "아이디 또는 비밀번호가 틀렸습니다.";
            }
        }
    </script>
</body>
</html>
